name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # lets a maintainer re-run CI by hand

jobs:
  test:
    name: Tests (native Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check:hygiene
      - run: npm run lab:lint -- --strict
      - run: npm test

  image:
    name: Image - validate every lab, full tests as root (per-session users)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The production image, built for the platform Beanstalk Cluster Mode nodes run.
      - run: docker buildx build --platform linux/amd64 --load -t tws-labs:ci .
      # Every task of every lab must fail before its solution and pass after it, and follow the house style.
      - run: docker run --rm tws-labs:ci node scripts/validate-labs.js --strict
      # Same tests as above, but as root with LAB_UID set, which turns on the isolation tests.
      - run: docker run --rm -v "$PWD/test:/app/test:ro" tws-labs:ci sh -c 'node --test --test-force-exit test/unit/*.test.js test/integration/*.test.js'

  compose:
    name: Local run - docker compose + smoke test (hardened container profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install websockets
      # The compose file drops every capability the server doesn't need; this catches
      # anything that only works with a default-capability container.
      - run: docker compose up -d --build --wait
      - run: python3 deploy/smoke-test.py localhost:8080
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
