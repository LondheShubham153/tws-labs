title: __TITLE__
level: beginner          # beginner | intermediate | advanced
minutes: 10
summary: One sentence on what the learner will be able to do afterwards.
steps:
  - id: intro
    type: lesson
    title: What this lab is about
    body: |
      Explain the one concept this lab teaches in a few lines. Markdown: **bold**, `code`,
      lists, fenced code blocks and [links](https://example.com).
  - id: create-file
    type: task
    title: Create a file
    body: Create a file called `hello.txt` that contains the word `hello`.
    hint: "A nudge, not the answer - shown when the check fails and prints no message."
  - id: list-files
    type: task
    title: Look around
    body: List the files in your home directory with the long format.
    hint: "Try the `ls` command with the `-l` option."
